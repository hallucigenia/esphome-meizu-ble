<g transform="translate(1044 198) scale(0.95)"><rect x="-45" y="-32" width="90" height="60" rx="8" fill="#EAF1F9" stroke="#48617D" stroke-width="4"/><path d="M0 29V42M-21 43H21" stroke="#48617D" stroke-width="4" stroke-linecap="round"/><path d="M-28-11H-1M-28 1H17M-28 13H6" stroke="#ACC3E0" stroke-width="4" stroke-linecap="round"/><circle cx="35" cy="20" r="3" fill="#A86212"/></g>
<text x="1044" y="278" font-size="24" fill="#172B43" font-weight="650" text-anchor="middle" data-max-width="194">红外设备</text>
