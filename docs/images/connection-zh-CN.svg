<path d="M600 424 L600 454" fill="none" stroke="#DBE4ED" stroke-width="2" stroke-linecap="round" />
<text x="322" y="446" font-size="20" fill="#326CE5" font-weight="600" text-anchor="middle" data-max-width="510">本地网络 · 加密 API</text>
