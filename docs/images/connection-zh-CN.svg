<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title description" xml:lang="zh-CN">
<title id="title">从 Home Assistant 到红外设备</title><desc id="description">连接示意：HA 与 ESP32 双向通信，ESP32 与 R16 蓝牙通信，R16 发射红外。设备为示意绘制。</desc>
<defs><filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#183C63" flood-opacity=".05"/></filter>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#326CE5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#087F8C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M1 1L8 5L1 9" fill="none" stroke="#A86212" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs><style>text {font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;}</style>
<rect width="1200" height="500" rx="28" fill="#F4F7FB"/>
<text x="44" y="48" font-size="30" fill="#172B43" font-weight="700" text-anchor="start" data-max-width="1112">从 Home Assistant 到红外设备</text>
<text x="44" y="82" font-size="18" fill="#52667E" font-weight="500" text-anchor="start" data-max-width="1112">加密 API 连接 HA · 蓝牙连接小圆饼 · 红外控制电器</text>
<rect x="44" y="126" width="224" height="250" rx="22" fill="white" stroke="#DBE4ED" filter="url(#shadow)"/>
